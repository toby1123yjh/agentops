# Compatibility entry point for existing --env-file .env.server-mode commands.
# New deployments use compose.yaml and .env without extra CLI arguments.
name: agentops-server

services:
  postgres:
    extends: {file: compose.yaml, service: postgres}
  clickhouse:
    extends: {file: compose.yaml, service: clickhouse}
  initialize:
    extends: {file: compose.yaml, service: initialize}
  api:
    extends: {file: compose.yaml, service: api}
  otelcollector:
    extends: {file: compose.yaml, service: otelcollector}
  dashboard:
    extends: {file: compose.yaml, service: dashboard}

volumes:
  server-postgres:
  server-clickhouse:
