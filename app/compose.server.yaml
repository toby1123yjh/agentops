name: agentops-server

x-api-environment: &api-environment
  AGENTOPS_LOCAL_MODE: 'true'
  AGENTOPS_PUBLIC_URL: ${AGENTOPS_PUBLIC_URL:?Set AGENTOPS_PUBLIC_URL}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-agentops}
  POSTGRES_USER: ${POSTGRES_USER:-agentops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
  POSTGRES_CONNECT_ATTEMPTS: ${POSTGRES_CONNECT_ATTEMPTS:-30}
  POSTGRES_CONNECT_DELAY_SECONDS: ${POSTGRES_CONNECT_DELAY_SECONDS:-2}
  SUPABASE_MIN_POOL_SIZE: ${POSTGRES_MIN_POOL_SIZE:-1}
  SUPABASE_MAX_POOL_SIZE: ${POSTGRES_MAX_POOL_SIZE:-5}
  AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:?Set AUTH_COOKIE_SECRET}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: '8123'
  CLICKHOUSE_USER: agentops
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
  CLICKHOUSE_DATABASE: otel_2
  CLICKHOUSE_SECURE: 'false'
  SENTRY_DSN: ''

services:
  postgres:
    image: postgres:15-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - server-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    environment:
      CLICKHOUSE_DB: otel_2
      CLICKHOUSE_USER: agentops
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - server-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      retries: 20
    restart: unless-stopped

  initialize:
    build:
      context: .
      dockerfile: local/Dockerfile.api
      args:
        PYPI_INDEX_URL: ${AGENTOPS_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment:
      <<: *api-environment
      AGENTOPS_LOCAL_EMAIL: ${AGENTOPS_LOCAL_EMAIL:?Set AGENTOPS_LOCAL_EMAIL}
      AGENTOPS_LOCAL_PASSWORD: ${AGENTOPS_LOCAL_PASSWORD:?Set AGENTOPS_LOCAL_PASSWORD}
    command: ['python', '-m', 'agentops.local_bootstrap']
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: local/Dockerfile.api
      args:
        PYPI_INDEX_URL: ${AGENTOPS_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment: *api-environment
    ports:
      - '127.0.0.1:${AGENTOPS_API_PORT:-32171}:8000'
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  otelcollector:
    build:
      context: ./opentelemetry-collector
      dockerfile: Dockerfile
      args:
        PYPI_INDEX_URL: ${AGENTOPS_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment:
      CLICKHOUSE_ENDPOINT: http://clickhouse:8123
      CLICKHOUSE_USERNAME: agentops
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: otel_2
      TRACES_TABLE_NAME: otel_traces
      LOGS_TABLE_NAME: otel_logs
      CLICKHOUSE_TTL: ${CLICKHOUSE_TTL:-180d}
      CLICKHOUSE_TIMEOUT: 10s
      JWT_SECRET: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    ports:
      - '127.0.0.1:${AGENTOPS_OTLP_PORT:-32172}:4318'
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../local/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${AGENTOPS_PUBLIC_URL:?Set AGENTOPS_PUBLIC_URL}
        NPM_REGISTRY: ${AGENTOPS_NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - '127.0.0.1:${AGENTOPS_DASHBOARD_PORT:-32170}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-postgres:
  server-clickhouse:
